# HelpLink Agent CI — thin WRAPPER around RustDesk's own build workflow.
# Place at: .github/workflows/build-agent.yml in YOUR (public) fork.

name: build-agent

on:
  workflow_dispatch:
  push:
    tags: ['agent-v*']

# The reusable workflow publishes release assets (SBOM + unsigned artifacts),
# so this run needs write access to repository contents. Upstream's own
# caller relies on their repo default being read/write; your fork's default
# is read-only, so we grant it here.
permissions:
  contents: write

jobs:
  agent:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit          # future: code-signing secrets pass through
    with:
      upload-artifact: true
      upload-tag: "helplink-agent"
