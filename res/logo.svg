<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140" role="img" aria-label="HelpLink logo">
  <title>HelpLink</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <rect x="20" y="20" width="100" height="100" rx="26" fill="url(#bg)"/>

  <!-- Two interlocked chain links -->
  <g transform="translate(70 70) rotate(-45)" fill="none" stroke-width="9" stroke-linecap="round">
    <rect x="-38" y="-13" width="44" height="26" rx="13" stroke="#FFFFFF"/>
    <rect x="-6" y="-13" width="44" height="26" rx="13" stroke="#FFD166"/>
  </g>

  <!-- Small heart accent (care) -->
  <path d="M100 38c-2-3-7-3-8 1-1-4-6-4-8-1-2 3 0 6 8 12 8-6 10-9 8-12z" fill="#FFFFFF" opacity="0.9" transform="translate(-4 -6) scale(1)"/>

  <!-- Wordmark -->
  <text x="142" y="88" font-family="'Poppins','Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="700" letter-spacing="-1">
    <tspan fill="#0F2A43">Help</tspan><tspan fill="#0EA5A4">Link</tspan>
  </text>
  <text x="145" y="110" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="3" fill="#64748B">CONNECTING PEOPLE TO HELP</text>
</svg>
